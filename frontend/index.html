<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akib Hasan — Banking Payment Middleware Engineer</title>
    <meta
      name="description"
      content=".NET banking integration engineer — payments middleware, core banking APIs, maker/checker workflows, and recoverable settlement paths."
    />
    <meta property="og:title" content="Akib Hasan — Banking Payment Middleware Engineer" />
    <meta
      property="og:description"
      content="Enterprise .NET middleware for banking payments, dual-control workflows, and core banking integration."
    />
    <meta name="theme-color" content="#0d1117" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
